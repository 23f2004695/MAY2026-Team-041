# S1-02: Sprint 1 API -> Milestone 1 user story traceability.
#
# Scope: every endpoint in the Sprint 1 modules that is actually implemented
# in backend/src/app/modules today (auth, books, members, reservations,
# seat-booking, payments, pricing-plans, admin). Later-sprint modules
# (community, reviews, notifications, guardian, translate, billing_requests,
# events, chat) are out of scope for this ticket.
#
# user_story is a US-<MODULE>-<NN> Milestone 1 story ID, or MM-02 (member
# sign-up sprint task). `null` means no single Milestone 1 story owns this
# endpoint — `note` gives a short reason instead.

- method: POST
  path: /api/v1/auth/register
  module: auth
  sprint: 1
  user_story: null
  note: Account sign-up — foundational, not tied to one story.

- method: POST
  path: /api/v1/auth/login
  module: auth
  sprint: 1
  user_story: null
  note: Login — foundational, not tied to one story.

