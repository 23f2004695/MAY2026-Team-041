[project]
name = "may2026-team-041-backend"
version = "0.1.0"
description = "FastAPI backend for MAY2026 Team 041"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "prisma>=0.15.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
